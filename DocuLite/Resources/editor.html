<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocuLite 编辑器</title>
<style>
/* ===== editor.css ===== */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #ffffff;
}
body {
  display: flex;
  flex-direction: column;
}
#editor {
  flex: 1;
  min-height: 100%;
  padding: 24px 32px 64px;
  outline: none;
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  font-size: 15px;
  line-height: 1.8;
  color: #1d1d1f;
  caret-color: #1d1d1f;
  max-width: 860px;
  word-wrap: break-word;
}
#editor p { margin: 0 0 0.6em; }
#editor h1 { font-size: 26px; line-height: 1.4; margin: 1.1em 0 0.5em; font-weight: 700; }
#editor h2 { font-size: 21px; line-height: 1.4; margin: 1em 0 0.5em; font-weight: 650; }
#editor h3 { font-size: 17px; line-height: 1.45; margin: 0.9em 0 0.4em; font-weight: 600; }
#editor blockquote {
  margin: 0.8em 0;
  padding: 2px 0 2px 14px;
  border-left: 3px solid #d2d2d7;
  color: #515154;
}
#editor ul, #editor ol { margin: 0.5em 0; padding-left: 26px; }
#editor li { margin: 0.15em 0; }
#editor img {
  max-width: 100%;
  height: auto;
  border-radius: 6px;
}
#editor a { color: #0066cc; }
#editor hr { border: none; border-top: 1px solid #d2d2d7; margin: 1.2em 0; }
#editor table { border-collapse: collapse; margin: 0.8em 0; }
#editor td, #editor th { border: 1px solid #d2d2d7; padding: 4px 10px; }
::selection { background: rgba(0, 120, 255, 0.25); }
</style>
</head>
<body>
<div id="editor" contenteditable="true" spellcheck="true"></div>
<script>
/* ===== editor.js ===== */
(function () {
  'use strict';

  var editor = document.getElementById('editor');

  // 背景色兜底：某些 WebKit 版本下 WKWebView(drawsBackground=false) 会把底色画黑，
  // 用 !important 强制白底，避免编辑区黑屏。
  document.documentElement.style.setProperty('background', '#ffffff', 'important');
  document.body.style.setProperty('background', '#ffffff', 'important');

  // WKWebView 的消息处理器（notify/reply）可能在脚本解析时尚未注册，
  // 或被外部拆包/复用而丢失；因此统一惰性读取，不缓存一次性引用。
  function getNotify() {
    try {
      return window.webkit && window.webkit.messageHandlers
        && window.webkit.messageHandlers.doculiteNotify;
    } catch (e) { return null; }
  }
  function getReply() {
    try {
      return window.webkit && window.webkit.messageHandlers
        && window.webkit.messageHandlers.doculite;
    } catch (e) { return null; }
  }

  function post(obj) {
    var n = getNotify();
    if (n) { n.postMessage(obj); }
  }

  // ---------- 内容变更（600ms 防抖；组合输入期间不保存） ----------
  var contentTimer = null;
  var composing = false;
  var lastContentPostAt = Date.now();
  function contentChanged() {
    if (composing) { return; }
    if (contentTimer) { clearTimeout(contentTimer); }
    var delay = (Date.now() - lastContentPostAt > 5000) ? 0 : 600;
    if (delay === 0) {
      lastContentPostAt = Date.now();
      post({ event: 'contentChanged' });
      return;
    }
    contentTimer = setTimeout(function () {
      contentTimer = null;
      lastContentPostAt = Date.now();
      post({ event: 'contentChanged' });
    }, delay);
  }

  // ---------- 选区状态上报（180ms 防抖） ----------
  var selTimer = null;
  function selectionChanged() {
    if (composing) { return; }
    if (selTimer) { clearTimeout(selTimer); }
    selTimer = setTimeout(function () {
      selTimer = null;
      if (!composing) { reportSelectionState(); }
    }, 180);
  }

  function reportSelectionState() {
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return;
    var range = sel.getRangeAt(0);
    if (!editor.contains(range.commonAncestorContainer)) return;
    var formatBlock = 'p';
    var node = range.commonAncestorContainer;
    if (node.nodeType === 3) node = node.parentNode;
    var block = node.closest('h1,h2,h3,blockquote,p,div');
    if (block && editor.contains(block)) {
      var tag = block.tagName.toLowerCase();
      if (tag === 'div') tag = 'p';
      formatBlock = tag;
    }
    post({
      event: 'selectionState',
      state: {
        bold: document.queryCommandState('bold'),
        italic: document.queryCommandState('italic'),
        underline: document.queryCommandState('underline'),
        strikeThrough: document.queryCommandState('strikeThrough'),
        insertUnorderedList: document.queryCommandState('insertUnorderedList'),
        insertOrderedList: document.queryCommandState('insertOrderedList'),
        justifyLeft: document.queryCommandState('justifyLeft'),
        justifyCenter: document.queryCommandState('justifyCenter'),
        justifyRight: document.queryCommandState('justifyRight'),
        justifyFull: document.queryCommandState('justifyFull'),
        formatBlock: formatBlock
      }
    });
  }

  document.addEventListener('selectionchange', selectionChanged);
  editor.addEventListener('focus', selectionChanged);
  editor.addEventListener('input', function () { contentChanged(); selectionChanged(); });
  editor.addEventListener('compositionstart', function () {
    composing = true;
    if (contentTimer) { clearTimeout(contentTimer); contentTimer = null; }
    if (selTimer) { clearTimeout(selTimer); selTimer = null; }
  });
  editor.addEventListener('compositionend', function () {
    composing = false;
    contentChanged();
    selectionChanged();
  });

  // ---------- 图片导入 ----------
  // 原生侧把图片写入文档 assets/ 并返回相对路径；失败时退回 data: URI 保证仍可显示。
  function importImage(dataURL, srcCallback) {
    var r = getReply();
    if (r) {
      r.postMessage({ action: 'importImage', dataURL: dataURL })
        .then(function (path) {
          if (srcCallback) {
            srcCallback((typeof path === 'string' && path.length > 0) ? path : dataURL);
          }
        })
        .catch(function () { if (srcCallback) { srcCallback(dataURL); } });
    } else if (srcCallback) {
      srcCallback(dataURL);
    }
  }

  function insertImageAtSelection(src) {
    // execCommand('insertImage') 在 WebKit 中不可靠（焦点丢失时为 no-op），
    // 改用 DOM API 直接插入 <img>。src 统一经 resolveSrc 规范化：data: 内联直接显示，
    // 相对/绝对路径在 file:// 临时页里受 WebKit opaque-origin 跨源限制常被拒载裂图，
    // 因此粘贴/拖拽（data:）可靠，工具栏直插也优先内联；此处不再做"补成绝对 URL"。
    src = resolveSrc(src);
    var img = document.createElement('img');
    img.src = src;
    img.alt = '';
    var sel = window.getSelection();
    var inserted = false;
    if (sel && sel.rangeCount > 0 && editor.contains(sel.anchorNode)) {
      var range = sel.getRangeAt(0);
      range.deleteContents();
      range.insertNode(img);
      var after = document.createElement('br');
      img.after(after);
      range = document.createRange();
      range.setStartAfter(after);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
      inserted = true;
    }
    if (!inserted) {
      editor.appendChild(document.createElement('p'));
      var lastP = editor.lastElementChild;
      if (lastP && lastP.tagName === 'P') {
        lastP.insertBefore(img, lastP.firstChild);
      } else {
        editor.appendChild(img);
      }
      var r2 = document.createRange();
      var after2 = document.createElement('br');
      img.after(after2);
      r2.setStartAfter(after2);
      r2.collapse(true);
      if (sel) { sel.removeAllRanges(); sel.addRange(r2); }
    }
    contentChanged();
  }

  // src 规范化：data:/http(https): 原样；其余（含相对与绝对 file 路径）保持原样。
  // 不再强行把相对路径补成绝对 URL——那会让 assets/xxx 被 <base>（指向文档包目录）
  // 解析到"文档包内的 assets"，而 WKWebView 临时页 + 跨源限制下这些 file:// 子资源
  // 经常拒载裂图。真正的显示保障在原生侧：工具栏/粘贴/拖拽一律内联 data: URI。
  function resolveSrc(src) {
    if (typeof src !== 'string' || src === '') return src;
    return src;
  }

  // 粘贴图片
  editor.addEventListener('paste', function (e) {
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (var i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf('image/') === 0) {
        e.preventDefault();
        var blob = items[i].getAsFile();
        var reader = new FileReader();
        reader.onload = function (evt) {
          importImage(evt.target.result, insertImageAtSelection);
        };
        reader.readAsDataURL(blob);
        return;
      }
    }
  });

  // 拖放图片
  editor.addEventListener('drop', function (e) {
    var files = e.dataTransfer && e.dataTransfer.files;
    if (!files || files.length === 0) return;
    for (var i = 0; i < files.length; i++) {
      if (files[i].type && files[i].type.indexOf('image/') === 0) {
        e.preventDefault();
        (function (file) {
          var reader = new FileReader();
          reader.onload = function (evt) {
            importImage(evt.target.result, insertImageAtSelection);
          };
          reader.readAsDataURL(file);
        })(files[i]);
        return;
      }
    }
  });

  // ---------- 原生调用 API ----------
  window.doculiteAPI = {
    setHTML: function (html) {
      editor.innerHTML = (html && html.length > 0) ? html : '<p><br></p>';
    },
    getHTML: function () {
      return editor.innerHTML;
    },
    exec: function (command, value) {
      editor.focus();
      document.execCommand(command, false, value || null);
      contentChanged();
      reportSelectionState();
    },
    insertImage: function (src) {
      insertImageAtSelection(src);
    },
    focus: function () {
      editor.focus();
    }
  };

  // ---------- 处理器自恢复：若首帧时 messageHandlers 尚未注册，轮询直至可用并发一次握手 ----------
  (function retryBind() {
    var n = getNotify(), r = getReply();
    if (n && r && !window.__doculiteBridgeReady) {
      window.__doculiteBridgeReady = true;
      try { n.postMessage({ event: 'bridgeReady' }); } catch (e) {}
      return;
    }
    setTimeout(retryBind, 120);
  })();
})();
</script>
</body>
</html>
